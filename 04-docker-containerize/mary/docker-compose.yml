# SecureNotes — docker-compose.yml
# Multi-container stack: API service + PostgreSQL database

services:
  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/securenotes"

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: "securenotes"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
